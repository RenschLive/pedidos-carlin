<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EC0000">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="logo_carlin.png">
<title>Pedidos · Carlin Lugo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#EC0000;--red-d:#B80000;--grey:#C8C8C8;--ink:#222222;--bg:#F2F2F2;--card:#fff;--line:#DADADA;--mut:#5E5E5E;
  --amb:#8A4B00;--amb-bg:#FFF1D1;--amb-line:#F0B238;--ok:#1F7A4D;
  --ease:cubic-bezier(.23,1,.32,1);--head:"Bricolage Grotesque",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--ink:#F2F2F2;--line:#3A3A3A;--mut:#A8A8A8;--amb-bg:#2E2208;--amb:#F4C56A;--red:#FF3B3B}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
*{-webkit-tap-highlight-color:transparent}
button,.card,nav button{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);padding-top:var(--safe-t);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--head);color:var(--red);letter-spacing:-.02em}
.logo img{height:30px;width:auto;display:block}
.sp{flex:1}
.search{width:min(280px,36vw);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--red);color:#fff;cursor:pointer;transition:transform .15s var(--ease),background .15s}
.btn:hover{background:var(--red-d)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.15fr);gap:14px;padding:16px 20px;overflow:hidden}
.col{display:flex;flex-direction:column;min-height:0}
.col h2{margin:0 0 10px;font:800 15px var(--head);display:flex;align-items:center;gap:8px}
.col h2 b{font:600 12px var(--body);background:var(--line);color:var(--mut);padding:1px 8px;border-radius:99px}
.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;width:100%;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s;animation:in .22s var(--ease)}
.card:hover{border-color:var(--mut)}
.card:active{transform:scale(.985)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card strong{display:block;font:800 16px/1.2 var(--head);letter-spacing:-.01em}
.card p{margin:4px 0 0;color:var(--mut);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.tag{padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--grey);font-weight:600}
.tag.late{background:var(--red);color:#fff}
.go{margin-top:10px;width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;transition:transform .15s var(--ease),background .15s}
.go:hover{background:var(--line)}
.go:active{transform:scale(.97)}
.col.urg{background:var(--amb-bg);border:1px solid var(--amb-line);border-radius:14px;padding:12px;margin:-4px 0;position:relative}
.col.urg::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(135deg,var(--amb-line) 0 8px,transparent 8px 16px)}
.col.urg h2{color:var(--amb);margin-top:6px}
.col.urg .card{border-color:var(--amb-line)}
.col.urg .csp{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--amb-bg);color:var(--amb);font-size:13px;white-space:pre-wrap}
.empty{color:var(--mut);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:12px}
nav{display:none}
[hidden]{display:none!important}
.icon{padding:9px 11px;display:grid;place-items:center}.icon svg{width:20px;height:20px}
.pick{display:flex;gap:8px}.pick input{flex:1;min-width:0}.pick .btn{padding:0 16px;font-size:22px;line-height:1}
.cwrap{padding:20px;display:grid;gap:12px}
#cview{display:grid;gap:12px}#cf{padding:0}
.chead{display:flex;gap:10px;align-items:center}.chead h3{flex:1;margin:0;font:800 20px var(--head)}
#clist{max-height:55vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.crow{display:block;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;margin-bottom:8px;transition:transform .15s var(--ease),border-color .15s}
.crow:hover{border-color:var(--mut)}.crow:active{transform:scale(.985)}
.crow strong{display:block;font:800 15px/1.25 var(--head)}.crow span{display:block;color:var(--mut);font-size:13px}
.tag.warn{display:inline-block;margin-top:6px;background:var(--amb-bg);color:var(--amb);border-color:var(--amb-line)}
dialog:not([open]){display:none}
dialog{position:fixed;top:0;bottom:0;left:0;right:0;margin:auto;height:fit-content;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.28)}
dialog[open]{animation:pop .22s var(--ease)}
dialog::backdrop{background:rgba(22,22,22,.55)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
form{padding:20px;display:grid;gap:12px}
form h3{margin:0;font:800 20px var(--head)}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-weight:400;font-size:16px}
textarea{resize:vertical;min-height:84px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.csp-box{display:none;padding:12px;border-radius:12px;background:var(--amb-bg);border:1px solid var(--amb-line)}
.csp-box label{color:var(--amb)}
.csp-box.on{display:grid}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;animation:in .2s var(--ease)}
@media(min-width:901px) and (max-width:1360px){
  main{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .col{scroll-snap-align:start}
}
@media(max-width:900px){
  header{padding:10px 14px}.search{flex:1;width:auto}
  main{display:block;padding:12px 14px;overflow:auto}
  .col{display:none;height:100%}
  body[data-tab=entrada] .col[data-s=entrada],body[data-tab=en_curso] .col[data-s=en_curso],body[data-tab=empaquetado] .col[data-s=empaquetado],body[data-tab=en_reparto] .col[data-s=en_reparto],body[data-tab=servido] .col[data-s=servido],body[data-tab=incompleto] .col[data-s=incompleto]{display:flex}
  .col h2{display:none}.col.urg{margin:0}.col>.list{width:100%;max-width:680px;margin:0 auto}
  nav{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  nav button{flex:1 0 auto;min-width:68px;border:0;background:none;padding:10px 8px 9px;font-size:11.5px;font-weight:600;color:var(--mut);cursor:pointer;border-top:3px solid transparent;transition:color .15s,border-color .15s}
  nav button b{display:block;font:800 17px var(--head);color:var(--ink)}
  nav button[aria-selected=true]{color:var(--red);border-color:var(--red)}
  nav button.u[aria-selected=true]{color:var(--amb);border-color:var(--amb-line)}
  nav button.u b{color:var(--amb)}
  .fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));box-shadow:0 8px 20px rgba(236,0,0,.35);border-radius:99px;padding:14px 20px}
  .row{grid-template-columns:1fr}
}
@media(min-width:901px){.fab{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-tab="entrada">
<header>
  <div class="logo">
    <img src="logo_carlin.png" alt="Carlin">
  </div>
  <div class="sp"></div>
  <input class="search" id="q" type="search" placeholder="Buscar cliente o producto" aria-label="Buscar pedido">
  <button class="btn ghost icon" id="cbtn" type="button" aria-label="Clientes" title="Clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/></svg></button>
  <button class="btn" id="new">Nuevo pedido</button>
</header>

<main id="board"></main>
<button class="btn fab" id="fab" aria-label="Nuevo pedido">+ Pedido</button>
<nav id="tabs" role="tablist"></nav>

<dialog id="dlg">
  <form id="f" method="dialog">
    <h3 id="ft">Nuevo pedido</h3>
    <label>Cliente<span class="pick"><input name="cliente" required autocomplete="off"><button type="button" class="btn ghost" id="pickc" aria-label="Elegir cliente registrado" title="Elegir cliente registrado">+</button></span></label>
    <div class="row">
      <label>Teléfono<input name="telefono" type="tel"></label>
      <label>Entrega prevista<input name="fecha_entrega" type="date"></label>
    </div>
    <label>Dirección de entrega<input name="direccion" autocomplete="off"></label>
    <label>Productos<textarea name="productos" placeholder="Ej.: 10 cajas de folios A4, 4 archivadores…"></textarea></label>
    <div class="row">
      <label>Importe (€)<input name="importe" type="number" step="0.01" inputmode="decimal"></label>
      <label>Estado<select name="estado" id="est"></select></label>
    </div>
    <div class="csp-box" id="cspb">
      <label>Pedido a Comercial del Sur (C.S.P.)<textarea name="pedido_csp" placeholder="Qué falta y qué se ha pedido a C.S.P."></textarea></label>
    </div>
    <label>Notas<textarea name="notas" style="min-height:56px"></textarea></label>
    <div class="acts">
      <button type="button" class="btn danger" id="del">Eliminar</button>
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button class="btn" id="save" value="ok">Guardar pedido</button>
    </div>
  </form>
</dialog>

<dialog id="cdlg">
  <div class="cwrap">
    <div id="cview">
      <div class="chead"><h3 id="ct">Clientes</h3><button class="btn ghost" id="cclose" type="button">Cerrar</button></div>
      <div class="chead"><input class="search" id="cq" type="search" placeholder="Buscar cliente, teléfono o dirección" style="width:auto;flex:1" aria-label="Buscar cliente"><button class="btn" id="cadd" type="button">Añadir cliente</button></div>
      <div id="clist"></div>
    </div>
    <form id="cf" hidden>
      <h3 id="cft">Nuevo cliente</h3>
      <label>Nombre<input name="nombre" required autocomplete="off"></label>
      <label>Teléfono y contacto<input name="telefono" placeholder="Ej.: 600000000 (Ana) & 611111111 (Luis)"></label>
      <label>Dirección de entrega<input name="direccion" autocomplete="off"></label>
      <div class="acts">
        <button type="button" class="btn danger" id="cdel">Eliminar</button>
        <button type="button" class="btn ghost" id="ccancel">Volver</button>
        <button class="btn">Guardar cliente</button>
      </div>
    </form>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURACIÓN ===== */
const CFG = {
  url: 'https://ioiwbwiyeuamzxmgypqa.supabase.co',
  key: 'sb_publishable_IZNAwtdKYKlHZLxBVPw_Pw_v2qzxcog'          // Supabase → Project Settings → API → anon public
};
/* ========================= */
const ST = [
  {id:'entrada',    n:'Entrada',    next:'en_curso',   go:'Pasar a En curso'},
  {id:'en_curso',   n:'En curso',   next:'empaquetado', go:'Pasar a Empaquetado'},
  {id:'empaquetado', n:'Empaquetado', next:'en_reparto', go:'Listo para reparto'},
  {id:'en_reparto', n:'En reparto', next:'servido',    go:'Marcar servido'},
  {id:'servido',    n:'Servido'},
  {id:'incompleto', n:'Urgencia / Incompleto', next:'en_curso', go:'Resuelto, volver a En curso', urg:1}
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live = CFG.key && !CFG.key.startsWith('PEGA');
const sb = live ? supabase.createClient(CFG.url, CFG.key) : null;
let rows = [], editing = null;

/* ---- datos: Supabase, o modo local si aún no hay clave ---- */
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2);
const LS = 'carlin-pedidos';
const local = () => JSON.parse(localStorage.getItem(LS) || '[]');
const keep = r => localStorage.setItem(LS, JSON.stringify(r));
async function load(){
  if (live){ const {data,error} = await sb.from('pedidos').select('*').order('created_at',{ascending:false}); if (error) return toast('No se pudo cargar: '+error.message); rows = data; }
  else rows = local();
  await purge();
  render();
}
async function purge(){
  const cut = Date.now() - 864e5;
  const old = rows.filter(r => r.estado==='servido' && r.servido_at && new Date(r.servido_at).getTime() < cut);
  if (!old.length) return;
  rows = rows.filter(r => !old.includes(r));
  if (live) await sb.from('pedidos').delete().in('id', old.map(r => r.id)); else keep(rows);
}
async function upsert(p){
  if (p.estado){ const o = rows.find(r => r.id===p.id); p.servido_at = p.estado==='servido' ? ((o && o.estado==='servido' && o.servido_at) || new Date().toISOString()) : null; }
  if (live){
    const {error} = p.id ? await sb.from('pedidos').update(p).eq('id',p.id) : await sb.from('pedidos').insert(p);
    if (error) return toast('No se pudo guardar: '+error.message);
  } else {
    if (p.id) rows = rows.map(r => r.id===p.id ? {...r,...p} : r);
    else rows.unshift({...p, id:uid(), created_at:new Date().toISOString()});
    keep(rows);
  }
  await load();
}
async function remove(id){
  if (live){ const {error} = await sb.from('pedidos').delete().eq('id',id); if (error) return toast(error.message); }
  else { rows = rows.filter(r => r.id!==id); keep(rows); }
  await load();
}
if (live) sb.channel('cambios')
  .on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},load)
  .on('postgres_changes',{event:'*',schema:'public',table:'clientes'},loadC).subscribe();

/* ---- interfaz ---- */
const today = new Date().toISOString().slice(0,10);
const fmtDate = d => d ? new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'}) : '';
function card(r, s){
  const late = r.fecha_entrega && r.fecha_entrega < today && r.estado !== 'servido';
  return `<article class="card" data-id="${r.id}" tabindex="0" role="button" aria-label="Abrir pedido de ${esc(r.cliente)}">
    <strong>${esc(r.cliente)}</strong>
    <p>${esc(r.productos) || 'Sin productos detallados'}</p>
    ${s.urg && r.pedido_csp ? `<div class="csp">C.S.P.: ${esc(r.pedido_csp)}</div>` : ''}
    <div class="meta">
      ${r.fecha_entrega ? `<span class="tag ${late?'late':''}">${late?'Atrasado · ':''}${fmtDate(r.fecha_entrega)}</span>` : ''}
      ${r.importe ? `<span>${Number(r.importe).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}</span>` : ''}
      ${r.estado==='servido' && r.servido_at ? `<span>Se borra en ${Math.max(1,Math.ceil((new Date(r.servido_at).getTime()+864e5-Date.now())/36e5))} h</span>` : ''}
    </div>
    ${s.next ? `<button class="go" data-go="${r.id}">${s.go}</button>` : ''}
  </article>`;
}
function render(){
  const q = $('#q').value.trim().toLowerCase();
  const hit = r => !q || (r.cliente+' '+(r.productos||'')).toLowerCase().includes(q);
  $('#board').innerHTML = ST.map(s => {
    const list = rows.filter(r => r.estado===s.id && hit(r));
    return `<section class="col ${s.urg?'urg':''}" data-s="${s.id}">
      <h2>${s.n} <b>${list.length}</b></h2>
      <div class="list">${list.map(r => card(r,s)).join('') || `<div class="empty">${s.id==='entrada'?'Sin pedidos nuevos. Pulsa “Nuevo pedido” para registrar uno.':'Nada por aquí.'}</div>`}</div>
    </section>`;
  }).join('');
  $('#tabs').innerHTML = ST.map(s => `<button role="tab" class="${s.urg?'u':''}" data-t="${s.id}" aria-selected="${document.body.dataset.tab===s.id}"><b>${rows.filter(r=>r.estado===s.id).length}</b>${s.urg?'Urgente':s.n}</button>`).join('');
  const t = $('#tabs'), a = t.querySelector('[aria-selected=true]'); if (a) t.scrollLeft = a.offsetLeft - (t.clientWidth - a.offsetWidth)/2;
}
$('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b){ document.body.dataset.tab = b.dataset.t; render(); } };
$('#q').oninput = render;

$('#board').onclick = e => {
  const g = e.target.closest('[data-go]');
  if (g){ e.stopPropagation(); const r = rows.find(x => x.id===g.dataset.go), s = ST.find(x => x.id===r.estado); return upsert({id:r.id, estado:s.next}); }
  const c = e.target.closest('.card'); if (c) open(c.dataset.id);
};
$('#board').onkeydown = e => { if (e.key==='Enter' && e.target.classList.contains('card')) open(e.target.dataset.id); };

/* ---- formulario ---- */
const f = $('#f'), dlg = $('#dlg');
const openD = () => dlg.showModal ? dlg.showModal() : dlg.setAttribute('open','');
const closeD = () => dlg.close ? dlg.close() : dlg.removeAttribute('open');
$('#est').innerHTML = ST.map(s => `<option value="${s.id}">${s.n}</option>`).join('');
const syncCsp = () => $('#cspb').classList.toggle('on', f.estado.value==='incompleto');
$('#est').onchange = syncCsp;
function open(id){
  editing = rows.find(r => r.id===id) || null; f.reset();
  $('#ft').textContent = editing ? 'Pedido de ' + editing.cliente : 'Nuevo pedido';
  for (const k of ['cliente','telefono','direccion','productos','importe','fecha_entrega','notas','pedido_csp','estado'])
    f[k].value = editing ? (editing[k] ?? '') : (k==='estado' ? document.body.dataset.tab : '');
  $('#del').style.display = editing ? '' : 'none';
  syncCsp(); openD();
}
$('#new').onclick = $('#fab').onclick = () => open(null);
$('#cancel').onclick = () => closeD();
dlg.addEventListener('click', e => { if (e.target===dlg) closeD(); });
$('#del').onclick = async () => { if (confirm('¿Eliminar este pedido? No se puede deshacer.')){ closeD(); await remove(editing.id); } };
f.onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  d.importe = d.importe === '' ? null : Number(d.importe);
  d.fecha_entrega = d.fecha_entrega || null;
  if (editing) d.id = editing.id;
  closeD(); await upsert(d);
};
/* ---- clientes ---- */
let cl = [], pick = false, cedit = null;
const cdlg = $('#cdlg'), cf = $('#cf');
const openX = d => d.showModal ? d.showModal() : d.setAttribute('open','');
const closeX = d => d.close ? d.close() : d.removeAttribute('open');
const sortC = a => a.sort((x,y) => x.nombre.localeCompare(y.nombre,'es') || (x.direccion||'').localeCompare(y.direccion||'','es'));
const saveLocal = () => localStorage.setItem('carlin-clientes', JSON.stringify(cl));
async function loadC(){
  if (live){ const {data,error} = await sb.from('clientes').select('*'); if (error) return toast('No se pudieron cargar los clientes: '+error.message); cl = data; }
  else cl = JSON.parse(localStorage.getItem('carlin-clientes') || '[]');
  sortC(cl); if (cdlg.hasAttribute('open')) renderC();
}
async function saveC(c){
  if (live){
    const q = c.id ? sb.from('clientes').update(c).eq('id',c.id) : sb.from('clientes').insert(c);
    const {data,error} = await q.select().single();
    if (error){ toast('No se pudo guardar el cliente: '+error.message); return null; }
    await loadC(); return data;
  }
  let r; if (c.id){ cl = cl.map(x => x.id===c.id ? (r = {...x,...c}) : x); } else { r = {...c, id:uid()}; cl.push(r); }
  sortC(cl); saveLocal(); renderC(); return r;
}
async function delC(id){
  if (live){ const {error} = await sb.from('clientes').delete().eq('id',id); if (error) return toast(error.message); await loadC(); }
  else { cl = cl.filter(x => x.id!==id); saveLocal(); renderC(); }
}
function renderC(){
  const q = $('#cq').value.trim().toLowerCase();
  const list = cl.filter(c => !q || [c.nombre,c.telefono,c.direccion].join(' ').toLowerCase().includes(q));
  $('#clist').innerHTML = list.map(c => `<button type="button" class="crow" data-c="${c.id}"><strong>${esc(c.nombre)}</strong>${c.telefono?`<span>${esc(c.telefono)}</span>`:''}${c.direccion?`<span>${esc(c.direccion)}</span>`:''}${!c.telefono||!c.direccion?'<span class="tag warn">Faltan datos</span>':''}</button>`).join('')
    || `<div class="empty">${cl.length ? 'Ningún cliente coincide.' : 'Aún no hay clientes. Pulsa “Añadir cliente”.'}</div>`;
  $('#ct').textContent = pick ? 'Elegir cliente' : 'Clientes (' + cl.length + ')';
}
function showList(){ cf.hidden = true; $('#cview').hidden = false; renderC(); }
function showForm(c){
  cedit = c; cf.reset();
  cf.nombre.value = c ? c.nombre : ''; cf.telefono.value = (c && c.telefono) || ''; cf.direccion.value = (c && c.direccion) || '';
  $('#cft').textContent = c ? 'Editar cliente' : 'Nuevo cliente';
  $('#cdel').style.display = c ? '' : 'none';
  $('#cview').hidden = true; cf.hidden = false; cf.nombre.focus();
}
function openC(p){ pick = p; $('#cq').value = ''; showList(); openX(cdlg); }
function choose(c){ f.cliente.value = c.nombre; f.telefono.value = c.telefono || ''; f.direccion.value = c.direccion || ''; closeX(cdlg); }
$('#cbtn').onclick = () => openC(false);
$('#pickc').onclick = () => openC(true);
$('#cclose').onclick = () => closeX(cdlg);
$('#cadd').onclick = () => showForm(null);
$('#ccancel').onclick = showList;
$('#cq').oninput = renderC;
$('#clist').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; const c = cl.find(x => x.id===b.dataset.c); pick ? choose(c) : showForm(c); };
$('#cdel').onclick = async () => { if (confirm('¿Eliminar este cliente? Los pedidos ya hechos no se borran.')){ await delC(cedit.id); showList(); } };
cdlg.addEventListener('click', e => { if (e.target===cdlg) closeX(cdlg); });
cf.onsubmit = async e => {
  e.preventDefault();
  const d = {nombre:cf.nombre.value.trim(), telefono:cf.telefono.value.trim() || null, direccion:cf.direccion.value.trim() || null};
  if (cedit) d.id = cedit.id;
  const r = await saveC(d); if (!r) return;
  if (pick && !cedit) return choose(r);
  showList();
};

function toast(m){ const t = document.createElement('div'); t.className='toast'; t.textContent=m; document.body.append(t); setTimeout(()=>t.remove(),4000); }

if (!live) toast('Modo local: añade tu anon key para guardar en Supabase');
load();
loadC();
setInterval(load, 600000);
</script>
</body>
